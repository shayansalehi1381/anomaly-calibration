[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anomaly-calibration"
version = "0.0.1"
description = "Conformal false-alarm calibration for industrial anomaly detection on VisA, under distribution shift."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
# Core = everything that runs in the cloud on CPU from saved score files.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "pillow>=10.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.8"]
# Laptop only (feature extraction and scoring on the GPU). On Windows install the
# CUDA build of torch first, see README "Runs on laptop with GPU".
gpu = ["torch>=2.4", "torchvision>=0.19", "timm>=1.0"]
dev = ["pytest>=8.0", "ruff>=0.5"]
# Re-execute notebooks/results.ipynb headless: jupyter nbconvert --execute
notebook = ["nbformat>=5.9", "nbconvert>=7.0", "ipykernel>=6.0", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "gpu: needs torch and (optionally) a CUDA device; skipped when torch is not installed",
    "integration: needs the real VisA dataset on disk (set ANOMCAL_VISA_ROOT); skipped otherwise",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# pyflakes, pycodestyle errors, import sorting, bugbear, pyupgrade
select = ["F", "E", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"scripts/make_results_summary.py" = ["E501"]  # long markdown f-strings with check comments
